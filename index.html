<!-- Main layout -->

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Device Info reads local system information from /proc, /sys, /system/bin and shell tools.">
<meta name="mobile-web-app-capable" content="yes">
<title>Device Info</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/theme.css?v=3">
<link rel="stylesheet" href="./css/base.css?v=4">
<link rel="stylesheet" href="./css/components.css?v=4">
<link rel="stylesheet" href="./css/widgets.css?v=3">
</head>
<body>

<div class="app">
  <header class="app-bar" id="app-bar">
    <div class="app-bar-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm5 16.4a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zM18 5H6v11h12V5z" fill="currentColor"/></svg>
      </div>
      <div class="app-bar-title">
        <h1 class="app-title">Device Info</h1>
        <span class="app-subtitle" id="subtitle">Reading system information</span>
      </div>
    </div>
    <div class="app-bar-actions">
      <button class="icon-btn" id="theme-btn" type="button" title="Toggle theme">
        <span id="theme-icon"></span>
      </button>
    </div>
  </header>

  <nav class="tab-bar" id="tab-bar" aria-label="Information sections"></nav>

  <main class="scroll" id="scroll">
    <div class="content" id="content"></div>
  </main>
</div>

<div class="snackbar" id="snackbar"></div>
<script type="module" src="./js/app.js?v=4"></script>
</body>
</html>
